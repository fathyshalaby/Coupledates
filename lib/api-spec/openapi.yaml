openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /reminder-preferences:
    get:
      operationId: getReminderPreferences
      responses:
        "200":
          description: Personal opt-in in-app notification preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
    put:
      operationId: saveReminderPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReminderPreferences" }
      responses:
        "200":
          description: Saved personal preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReminderPreferences" }
  /reminders:
    get:
      operationId: listReminders
      responses:
        "200":
          description: Due private in-app reminders; evaluated on foreground polling
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Reminder" }
  /reminders/{id}:
    delete:
      operationId: dismissReminder
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "204": { description: Reminder permanently dismissed for this person }
  /billing/status:
    get:
      operationId: getBillingStatus
      responses:
        "200":
          description: Shared space subscription and your billing permissions
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /billing/refresh:
    post:
      operationId: refreshBilling
      responses:
        "200":
          description: Verified against Whop, not against redirect parameters
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /billing/checkout:
    post:
      operationId: createBillingCheckout
      responses:
        "200":
          description: Hosted checkout reserved for this space
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingCheckout" }
  /billing/manage:
    post:
      operationId: manageBilling
      responses:
        "200":
          description: Verified membership management URL for the billing owner
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingLink" }
  /billing/cancel:
    post:
      operationId: cancelBilling
      responses:
        "200":
          description: Auto-renewal stopped; access retained through paid-through date
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /billing/resume:
    post:
      operationId: resumeBilling
      responses:
        "200":
          description: Renewal resumed for the existing subscription
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BillingStatus" }
  /calendar/status:
    get:
      operationId: getCalendarStatus
      responses:
        "200":
          description: Your calendar permissions and partner's sharing status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarStatus" }
  /calendar/connect:
    post:
      operationId: connectCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarPreferenceInput" }
      responses:
        "200":
          description: Verified personal Google authorization
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarStatus" }
  /calendar/preferences:
    put:
      operationId: saveCalendarPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CalendarPreferenceInput" }
      responses:
        "200":
          description: Availability sharing updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarStatus" }
  /calendar/connection:
    delete:
      operationId: disconnectCalendar
      responses:
        "204": { description: Application calendar access disabled; Google sign-in and existing calendar copies retained }
  /calendar/availability:
    get:
      operationId: getCalendarAvailability
      parameters:
        - { name: date, in: query, required: true, schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' } }
        - { name: durationMinutes, in: query, required: true, schema: { type: integer, minimum: 30, maximum: 240 } }
        - { name: timezone, in: query, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Shared free slots, without personal calendar event details
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CalendarAvailability" }
  /dates/{id}/calendar:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getDateCalendar
      responses:
        "200":
          description: Your saved Google copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateCalendarState" }
    post:
      operationId: saveDateToCalendar
      responses:
        "200":
          description: Explicitly saved or updated your primary-calendar copy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateCalendarState" }
    delete:
      operationId: removeDateFromCalendar
      responses:
        "204": { description: Removed your saved copy }
  /dates/{id}/calendar.ics:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: exportDateCalendar
      responses:
        "200":
          description: One-time iCalendar download, not a live subscription
          content:
            text/calendar:
              schema: { type: string }
  /preferences:
    get:
      operationId: getPreferences
      responses:
        "200":
          description: Both partners' shared date preferences
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PartnerPreferences" }
    put:
      operationId: savePreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PreferencesInput" }
      responses:
        "200":
          description: Your saved preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PartnerPreferences" }
  /openai/date-assistant:
    get:
      operationId: getAssistantHistory
      responses:
        "200":
          description: Saved shared planning conversations, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AssistantTurn" }
    post:
      operationId: askDateAssistant
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AssistantInput" }
      responses:
        "200":
          description: Personalized ideas, not live venue listings or bookings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AssistantTurn" }
  /dates/{id}/detail:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getDateDetail
      responses:
        "200":
          description: Date, shared album and individual reviews
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateDetail" }
  /dates/{id}/respond:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: respondToDate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DateResponseInput" }
      responses:
        "200":
          description: Date state updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePlan" }
  /dates/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: reviewDate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Your review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DateDetail" }
  /couple:
    get:
      operationId: getCouple
      responses:
        "200":
          description: Current couple space, or null before onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CoupleState" }
    post:
      operationId: saveCouple
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CoupleInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Couple" }
  /couple/join:
    post:
      operationId: joinCouple
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JoinInput" }
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Couple" }
  /memories:
    get:
      operationId: listMemories
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Memory" }
    post:
      operationId: createMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
  /memories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateMemory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemoryInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Memory" }
    delete:
      operationId: deleteMemory
      responses:
        "204": { description: Deleted }
  /dates:
    get:
      operationId: listDates
      responses:
        "200":
          description: Dates
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DatePlan" }
    post:
      operationId: createDate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DateInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePlan" }
  /dates/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateDate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DateInput" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DatePlan" }
    delete:
      operationId: deleteDate
      responses:
        "204": { description: Deleted }
  /check-ins:
    post:
      operationId: checkIn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CheckInInput" }
      responses:
        "200":
          description: Streak updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /summary:
    get:
      operationId: getSummary
      responses:
        "200":
          description: Relationship summary
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Summary" }
  /recap:
    get:
      operationId: getRecap
      parameters:
        - { name: year, in: query, schema: { type: integer, minimum: 2000, maximum: 2100 } }
      responses:
        "200":
          description: Year in review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Recap" }
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadInput" }
      responses:
        "200":
          description: Upload target
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadTarget" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    ReminderPreferences:
      type: object
      required: [timezone, dateEnabled, photoEnabled, leadMinutes]
      properties:
        timezone: { type: string, minLength: 1, maxLength: 100 }
        dateEnabled: { type: boolean }
        photoEnabled: { type: boolean }
        leadMinutes: { type: integer, enum: [15, 60, 1440] }
    Reminder:
      type: object
      required: [id, dateId, title, kind, dueAt, timezone, href]
      properties:
        id: { type: integer }
        dateId: { type: integer }
        title: { type: string }
        kind: { type: string, enum: [date, photo] }
        dueAt: { type: string, format: date-time }
        timezone: { type: string }
        href: { type: string }
    BillingStatus:
      type: object
      required: [plan, entitled, providerStatus, isPayer, canManage, cancelAtPeriodEnd, currentPeriodEnd, checkoutPending, checkoutAvailable, verificationPending, notice, price, currency, billingIntervalDays]
      properties:
        plan: { type: string, enum: [free, plus] }
        entitled: { type: boolean }
        providerStatus: { type: string }
        isPayer: { type: boolean }
        canManage: { type: boolean }
        cancelAtPeriodEnd: { type: boolean }
        currentPeriodEnd: { type: ["string", "null"] }
        checkoutPending: { type: boolean }
        checkoutAvailable: { type: boolean }
        verificationPending: { type: boolean }
        notice: { type: string }
        price: { type: number }
        currency: { type: string }
        billingIntervalDays: { type: integer }
    BillingLink:
      type: object
      required: [url]
      properties:
        url: { type: string }
    BillingCheckout:
      type: object
      required: [url, resumed]
      properties:
        url: { type: string }
        resumed: { type: boolean }
    CoupleState:
      type: object
      required: [couple]
      properties:
        couple:
          anyOf:
            - { $ref: "#/components/schemas/Couple" }
            - { type: "null" }
    CoupleInput:
      type: object
      required: [yourName, partnerName, anniversary, timezone]
      properties:
        yourName: { type: string, minLength: 1, maxLength: 60 }
        partnerName: { type: string, minLength: 1, maxLength: 60 }
        anniversary: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        timezone: { type: string, maxLength: 100 }
    Couple:
      type: object
      required: [id, yourName, partnerName, anniversary, timezone, inviteCode, memberCount]
      properties:
        id: { type: integer }
        yourName: { type: string }
        partnerName: { type: string }
        anniversary: { type: string }
        timezone: { type: string }
        inviteCode: { type: string }
        memberCount: { type: integer }
    JoinInput:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 8, maxLength: 100 }
    MemoryInput:
      type: object
      required: [title, note, date, category]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        note: { type: string, maxLength: 5000 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        category: { type: string, enum: [Everyday, Adventure, Food, Travel, Milestone] }
        photoPath: { type: ["string", "null"] }
        favorite: { type: boolean }
        dateId: { type: ["integer", "null"] }
    Memory:
      allOf:
        - { $ref: "#/components/schemas/MemoryInput" }
        - type: object
          required: [id, createdAt, favorite]
          properties:
            id: { type: integer }
            createdAt: { type: string }
            favorite: { type: boolean }
    DateInput:
      type: object
      required: [title, date, location, category, notes, status]
      properties:
        expectedVersion: { type: integer, minimum: 0 }
        timezone: { type: string, maxLength: 100 }
        durationMinutes: { type: integer, minimum: 30, maximum: 240 }
        title: { type: string, minLength: 1, maxLength: 150 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        time: { type: string, maxLength: 10 }
        location: { type: string, maxLength: 200 }
        category: { type: string, enum: [Everyday, Adventure, Food, Travel, Milestone] }
        notes: { type: string, maxLength: 5000 }
        status: { type: string, enum: [proposed, planned, active, completed, declined] }
        rating: { type: ["number", "null"], minimum: 1, maximum: 5 }
        mode: { type: string, enum: [in_person, remote] }
        meetingUrl: { type: string, maxLength: 1000 }
        latitude: { type: ["number", "null"], minimum: -90, maximum: 90 }
        longitude: { type: ["number", "null"], minimum: -180, maximum: 180 }
    DatePlan:
      allOf:
        - { $ref: "#/components/schemas/DateInput" }
        - type: object
          required: [id, version, isProposer, canRespond, responseNote, mode]
          properties:
            id: { type: integer }
            version: { type: integer }
            isProposer: { type: boolean }
            canRespond: { type: boolean }
            responseNote: { type: string }
            startedAt: { type: ["string", "null"] }
    PreferencesInput:
      type: object
      required: [displayName, interests, avoid, budget, currency, city, timezone, relationshipMode, availability, notes]
      properties:
        displayName: { type: string, minLength: 1, maxLength: 60 }
        interests:
          type: array
          minItems: 1
          maxItems: 20
          items: { type: string, minLength: 1, maxLength: 60 }
        avoid: { type: string, maxLength: 1000 }
        budget: { type: integer, minimum: 0, maximum: 10000 }
        currency: { type: string, enum: [USD, EUR, GBP, CAD, AUD, INR, Other] }
        city: { type: string, maxLength: 120 }
        timezone: { type: string, maxLength: 100 }
        relationshipMode: { type: string, enum: [together, long_distance] }
        availability:
          type: array
          maxItems: 14
          items: { type: string, minLength: 1, maxLength: 60 }
        notes: { type: string, maxLength: 1500 }
    CalendarPreferenceInput:
      type: object
      required: [shareAvailability]
      properties:
        shareAvailability: { type: boolean }
    CalendarStatus:
      type: object
      required: [connected, needsConsent, shareAvailability, partnerSharing]
      properties:
        connected: { type: boolean }
        needsConsent: { type: boolean }
        shareAvailability: { type: boolean }
        partnerSharing: { type: boolean }
    CalendarSlot:
      type: object
      required: [start, end]
      properties:
        start: { type: string }
        end: { type: string }
    CalendarAvailability:
      type: object
      required: [complete, notice, slots, timezone, checkedAt]
      properties:
        complete: { type: boolean }
        notice: { type: string }
        slots:
          type: array
          items: { $ref: "#/components/schemas/CalendarSlot" }
        timezone: { type: string }
        checkedAt: { type: string }
    DateCalendarState:
      type: object
      required: [saved, stale, eventUrl, notice]
      properties:
        saved: { type: boolean }
        stale: { type: boolean }
        eventUrl: { type: ["string", "null"] }
        notice: { type: string }
    PartnerPreferences:
      allOf:
        - { $ref: "#/components/schemas/PreferencesInput" }
        - type: object
          required: [isYou]
          properties:
            isYou: { type: boolean }
    AssistantInput:
      type: object
      required: [message]
      properties:
        message: { type: string, minLength: 1, maxLength: 1500 }
    DateIdea:
      type: object
      required: [title, description, whyBoth, category, mode, location, estimatedCost, durationMinutes, steps]
      properties:
        title: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 1500 }
        whyBoth: { type: string, maxLength: 1000 }
        category: { type: string, enum: [Everyday, Adventure, Food, Travel, Milestone] }
        mode: { type: string, enum: [in_person, remote] }
        location: { type: string, maxLength: 200 }
        estimatedCost: { type: string, maxLength: 120 }
        durationMinutes: { type: integer, minimum: 10, maximum: 1440 }
        steps:
          type: array
          minItems: 1
          maxItems: 8
          items: { type: string, maxLength: 500 }
    AssistantTurn:
      type: object
      required: [id, prompt, message, ideas, createdAt]
      properties:
        id: { type: integer }
        prompt: { type: string }
        message: { type: string }
        ideas:
          type: array
          maxItems: 4
          items: { $ref: "#/components/schemas/DateIdea" }
        createdAt: { type: string }
    DateResponseInput:
      type: object
      required: [action, version]
      properties:
        action: { type: string, enum: [accept, decline, counter, start, complete] }
        version: { type: integer, minimum: 0 }
        note: { type: string, maxLength: 1500 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        time: { type: string, maxLength: 10 }
    ReviewInput:
      type: object
      required: [rating, note]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        note: { type: string, maxLength: 1500 }
    DateReview:
      type: object
      required: [id, displayName, isYou, rating, note]
      properties:
        id: { type: integer }
        displayName: { type: string }
        isYou: { type: boolean }
        rating: { type: integer }
        note: { type: string }
    DateDetail:
      type: object
      required: [date, memories, reviews]
      properties:
        date: { $ref: "#/components/schemas/DatePlan" }
        memories:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/DateReview" }
    CheckInInput:
      type: object
      required: [activity]
      properties:
        activity: { type: string, enum: [Quality time, A little adventure, A good conversation] }
    Summary:
      type: object
      required: [daysTogether, memoryCount, completedDates, currentStreak, longestStreak, checkedInToday, weekDays]
      properties:
        daysTogether: { type: integer }
        memoryCount: { type: integer }
        completedDates: { type: integer }
        currentStreak: { type: integer }
        longestStreak: { type: integer }
        checkedInToday: { type: boolean }
        weekDays:
          type: array
          items:
            type: object
            required: [date, checked]
            properties:
              date: { type: string }
              checked: { type: boolean }
    Recap:
      type: object
      required: [year, memoryCount, dateCount, averageRating, topCategory, topMemories, longestStreak, activeDays, monthlyCounts]
      properties:
        year: { type: integer }
        memoryCount: { type: integer }
        dateCount: { type: integer }
        averageRating: { type: number }
        topCategory: { type: string }
        topMemories:
          type: array
          items: { $ref: "#/components/schemas/Memory" }
        longestStreak: { type: integer }
        activeDays: { type: integer }
        monthlyCounts:
          type: array
          items: { type: integer }
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp, image/heic, image/heif] }
    UploadTarget:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string }
        objectPath: { type: string }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

